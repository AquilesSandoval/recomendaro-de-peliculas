services:
  # Backend: Node.js + SWI-Prolog
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3001"
      - "8081"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PROLOG_HOST=localhost
      - PROLOG_PORT=8081
    restart: unless-stopped

  # Frontend: React buildeado + nginx como proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
